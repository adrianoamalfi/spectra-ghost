name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {version} = require('./package.json');
          const expected = `v${version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${expected}`);
            process.exit(1);
          }
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== version || lock.packages?.['']?.version !== version) {
            console.error(`package-lock.json version does not match package.json version ${version}`);
            process.exit(1);
          }
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## [${version}] - `)) {
            console.error(`CHANGELOG.md has no dated release section for ${version}`);
            process.exit(1);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run docs
      - name: Docs are up to date
        run: git diff --exit-code README.md docs/index.html
      - run: npm run zip
      - name: Validate installable theme archive
        run: npx gscan --zip spectra.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" spectra.zip --clobber
          else
            gh release create "$RELEASE_TAG" spectra.zip \
              --title "Spectra $RELEASE_TAG" \
              --generate-notes
          fi
